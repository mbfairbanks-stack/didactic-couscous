services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - demo
    restart: unless-stopped

  app:
    build: .
    expose:
      - "80"
    volumes:
      - ./data:/data        # auth.db + all user databases survive rebuilds
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - BUDGET_PASSWORD=${BUDGET_PASSWORD:-}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-demo}
      - MULTI_USER=true
      - DB_PATH=/data/budget.db
      - AUTH_DB_PATH=/data/auth.db
      - USER_DB_DIR=/data/users
    restart: unless-stopped

  demo:
    build: .
    expose:
      - "80"
    environment:
      - DEMO_MODE=true
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
