services:
  app:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./data:/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - BUDGET_PASSWORD=${BUDGET_PASSWORD:-}
      - MULTI_USER=true
      - DB_PATH=/data/budget.db
      - AUTH_DB_PATH=/data/auth.db
      - USER_DB_DIR=/data/users
    restart: unless-stopped
